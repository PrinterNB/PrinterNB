# Regenerates loc-card.svg (total lines of code across all public repos) and
# commits it. Runs daily and on demand: Actions > Lines of code card > Run workflow.
name: Lines of code card

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate card
        run: node .github/scripts/loc-card.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit
        run: |
          git config user.name "PrinterNB[bot]"
          git config user.email "191417264+PrinterNB@users.noreply.github.com"
          git add loc-card.svg
          git diff --cached --quiet || git commit -m "Update lines-of-code card"
          git push
